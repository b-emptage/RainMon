# Greenhill rain-sensor bridge (Windows 7 box).
#
# This file must sit BESIDE rain_broadcaster.exe, not inside it. The frozen
# build reads it from the executable's own directory, and writes
# rain_broadcaster.log there too.
#
# Everything here describes the hardware and the network. There are no
# thresholds and no safety rules: those live on the Windows 11 weather service,
# so this machine does not need touching when they change.

[rain]

# Serial port the detectors are wired to.
com = COM7

# Detectors present, as index:name. The index is the unit number set by links
# on the detector's main PCB and used in the *RnS command; the name is what the
# operators call it and what travels on the wire.
#
# Three are installed today (six sections). A fourth is a line here, not a
# rebuild -- add it as 3:NAME once the unit is in.
detectors = 0:H127, 1:H50, 2:ACC

baud = 9600

# Seconds to wait for a detector's reply. 0.9 matches the legacy software.
# Every detector that fails costs one of these, which is why a detector that
# has failed repeatedly is polled only occasionally -- see rain_serial.py.
read_timeout = 0.9
write_timeout = 0.4

# Seconds between packets. The receiver's staleness watchdog is set as a
# multiple of this, so changing it here means changing it there too.
interval = 1.0

# Multicast destination. Adjacent to the anemometer's 239.192.0.4:60004.
group = 239.192.0.5
port = 60005

# TTL 1 keeps the stream on the local segment. Raise it only if the packets
# genuinely have to cross a router, and configure IGMP if so.
ttl = 1

# Local interface to send from, by IP. Leave blank to let Windows choose.
#
# SET THIS IF THE BOX HAS MORE THAN ONE NETWORK ADAPTER. Windows otherwise
# picks the outgoing interface from the routing table, and if it picks wrong
# the send still succeeds -- it simply arrives nowhere, with nothing in any log
# to say so.
interface =

log_level = INFO
log_max_mb = 5
log_keep = 10
