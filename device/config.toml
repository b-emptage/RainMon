title = "Greenhill Weather (Alpaca)"

[network]
ip_address = ''             # Any address
port = 11112                # 11111 on this box is the equipment server

[server]
location = 'Greenhill Observatory, Tasmania'
verbose_driver_exceptions = true

[device]
sync_write_connected = true

# ---------------------------------------------------------------------------
# The two sensor streams.
#
# The anemometer's group is set by the instrument itself and is not ours to
# change. The rain group is the bridge's, and MUST MATCH rain_broadcaster.ini
# on the Windows 7 box.
#
# Both machines must be on the same layer-2 segment, or IGMP must be configured
# for 239.192.0.0/14. The Windows Firewall on this box must allow the inbound
# UDP -- a blocked stream looks exactly like a dead sensor, which is unsafe but
# unhelpful.
# ---------------------------------------------------------------------------
[multicast]
wind_group = '239.192.0.4'
wind_port = 60004
rain_group = '239.192.0.5'
rain_port = 60005
interface = ''              # blank = let the OS choose; set it if multi-homed

# ---------------------------------------------------------------------------
# WEATHER THRESHOLDS AND LATCH TIMINGS.  Full explanation in docs/SAFETY.md.
#
# Everything is SI. Metres per second, not km/h: ASCOM ObservingConditions is
# defined in m/s and Arcsecond stores m/s, so a km/h value here would be a
# threshold wrong by a factor of 3.6.
#
# Anything omitted falls back to the default in greenhill/core/config.py.
# ---------------------------------------------------------------------------
[weather]

# --- wind ---
wind_sustained_max_ms = 5.5556      # 20 km/h, 60 s mean
wind_gust_max_ms = 8.3333           # 30 km/h, strongest 3 s average in 2 min

# PROVISIONAL -- the anemometer's sentence format has never been written down.
# These are the positions the legacy display reads. Confirm them with
# tools/record_streams.py, which prints a real sentence field by field.
wind_direction_field = 2
wind_speed_field = 4

# PROVISIONAL -- the legacy display adds 30 degrees, with no note saying why;
# presumably a mounting correction. Carried forward so behaviour does not
# change silently. DO NOT TRUST WindDirection until this has been checked
# against a known reference.
#
# Negative values are fine: the bearing wraps, so -30 and 330 are the same
# correction. The value must be a finite number -- a NaN or an infinity is
# ignored with a loud startup message, because it would otherwise reach the
# wire as invalid JSON and break every Alpaca client reading this device.
wind_north_offset_deg = 30.0

# --- rain ---
# Sections, not detectors: each detector has two that trigger independently, so
# one detector reporting W reaches this on its own.
rain_wet_sections_trigger = 2

# A single wet section clearing within this long is a real raindrop evaporating
# off a heated sensor. One that persists longer is contamination -- droppings,
# an insect, a failed sensor -- and is NOT rain.
raindrop_window_s = 10.0

# How many detectors must report a usable state for the reading to count. With
# three installed, two means one failure does not blind the observatory while a
# single survivor is not asked to speak for the whole site.
rain_min_observing_detectors = 2

# --- staleness and latching ---
# Streams arrive about once a second; these allow plenty of dropped datagrams
# before declaring a source dead.
rain_max_age_s = 15.0
wind_max_age_s = 15.0

# Unsafe after a restart until both streams have been healthy this long.
settle_s = 30.0

# After rain, everything must stay dry this long before the latch releases.
# Comfortably above the 2-5 minute drying time of a heated sensor. Note the
# countdown FREEZES whenever the sensors cannot be read: the clear period is
# ten minutes of observed dryness, not ten minutes of not looking.
rain_clear_s = 600.0

# Wind needs far less -- nothing has to dry, it only has to stop gusting.
wind_clear_s = 120.0

# ---------------------------------------------------------------------------
# ROUTE 1 -- the direct dome close.
#
# When the safety verdict goes false, this service can command the dome server
# on the other machine to close, and then watch until the dome confirms it is
# shut. That takes a second or two. Arcsecond reaches the same conclusion and
# runs its own close procedure, but on a 60 s weather poll plus a 30 s safety
# heartbeat -- up to about ninety seconds behind.
#
# Both routes are meant to fire. Closing a closed dome is a no-op, so the
# overlap costs nothing and neither route is a single point of failure.
#
# OFF BY DEFAULT. Turn it on deliberately, once the address is confirmed and a
# dry-run close has been watched on the real dome. The server logs loudly at
# startup whichever state this is in, so a forgotten `false` cannot pass
# unnoticed.
#
# This service NEVER reopens the dome -- that is Arcsecond's recovery
# procedure -- and it never disconnects from it, because the dome de-energises
# its motors on Disconnect and doing that mid-close would stop the close.
# ---------------------------------------------------------------------------
# These sit in the [weather] table above -- flat keys, not a sub-table, because
# a nested table would arrive as a dict that the settings loader ignores.
dome_close_enabled = false
dome_address = ''               # 'host:11111' of the dome Alpaca server
dome_device_number = 0

# How often to look at the dome while a close is running.
dome_poll_interval_s = 2.0

# How long to let a close run before commanding another. MUST comfortably
# exceed the dome's full travel time, or a slow close collects a second command
# halfway through. Measure the real travel before trusting this number.
dome_verify_timeout_s = 45.0

# Fast attempts before escalating. After this it keeps trying, but slowly and
# with one loud message rather than a log filling at 1 Hz. It never gives up:
# the roof still has to shut.
dome_retry_limit = 3
dome_escalated_retry_s = 60.0

[logging]
log_level = 'INFO'
log_to_stdout = true
max_size_mb = 5
num_keep_logs = 10
