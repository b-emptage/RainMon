# The Greenhill weather window.
#
# A listener. It shows what the rain bridge and the anemometer are saying, and
# says the important parts out loud. It commands nothing, and it needs neither
# Arcsecond nor the weather service to be running -- open it on as many
# machines as you like.

[monitor]

# The two sensor streams. Must match the observatory's; the rain group is set
# in rain_broadcaster.ini on the Windows 7 box.
wind_group = 239.192.0.4
wind_port = 60004
rain_group = 239.192.0.5
rain_port = 60005

# Local interface to receive on, by IP.
#
# SET THIS IF THE MACHINE HAS MORE THAN ONE NETWORK ADAPTER. Left blank the OS
# chooses, and if it chooses wrong the join succeeds and no packets ever
# arrive -- which looks exactly like a dead sensor. This is the fault that
# already caught the observatory once. `python tools/mcast_diag.py` reports
# which interface actually receives.
interface =

# Spoken alerts. --mute silences them for one run without editing this.
speaker = true

# How often to repeat the rain announcement while the sensors stay wet. The
# only alert that repeats; everything else is announced on change.
alert_repeat_seconds = 30

# Which alerts to speak: rain, safety, faults. Drop any that become tiresome --
# `faults` is the one that says the sensors have stopped answering, which is
# the announcement worth keeping if you keep only one.
alert_categories = rain, safety, faults

# OPTIONAL: the weather service, as host:port. When set, the window also shows
# the observatory's own verdict -- the one that actually closes the dome -- and
# says so if it disagrees with what this window worked out. Leave blank to stay
# entirely self-contained.
safety_address =

log_level = INFO
